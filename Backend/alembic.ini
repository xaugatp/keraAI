# Alembic configuration for the KeraAI backend.
#
# Run from Backend/ with the venv active:  alembic upgrade head
#
# There is deliberately NO `sqlalchemy.url` here: alembic/env.py builds the URL
# from app.core.config.Settings (the same DB_* variables / .env the API uses), so
# credentials live in exactly one place and are never committed.

[alembic]
# Resolved relative to this file, so `alembic` works from any directory.
script_location = %(here)s/alembic

# Put Backend/ on sys.path so env.py can `import app...`
prepend_sys_path = .
path_separator = os

# Versions are named by their hand-picked revision id, e.g. 0001_create_analyses.py
# (alembic revision --autogenerate generates random ids; keep the slug meaningful).
file_template = %%(rev)s_%%(slug)s

# Logging for the alembic CLI only (the app configures its own logging in
# app/core/logging.py; env.py skips this when migrations run inside the app/tests).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
