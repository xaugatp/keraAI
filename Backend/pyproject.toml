[project]
name = "keraai-backend"
version = "0.1.0"
description = "KeraAI backend — banana plant/leaf computer-vision API"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mssql: requires a real SQL Server instance (KeraAI_Test) and applies Alembic migrations",
    "model: requires real model weights on disk",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/tree_classifier.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
